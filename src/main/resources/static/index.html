<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Log Analyzer</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

    <header>
        <h1>Smart Log Analyzer</h1>
        <p>Security and Operational Log Monitoring Dashboard</p>
    </header>

    <section class="upload-card">

        <h2>Upload Log File</h2>

        <div class="upload-row">
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">Analyze Logs</button>
        </div>

        <p id="status"></p>

    </section>

    <section class="stats-grid">

        <div class="card">
            <h3>Total Logs</h3>
            <span id="totalLogs">0</span>
        </div>

        <div class="card">
            <h3>Errors</h3>
            <span id="errors">0</span>
        </div>

        <div class="card">
            <h3>Failed Logins</h3>
            <span id="failedLogins">0</span>
        </div>

        <div class="card">
            <h3>Suspicious IPs</h3>
            <span id="ipCount">0</span>
        </div>

    </section>

    <section class="chart-card">
        <h2>Analysis Overview</h2>
        <canvas id="logChart"></canvas>
    </section>

    <section class="table-card">

        <h2>Suspicious IP Activity</h2>

        <table>

            <thead>
            <tr>
                <th>IP Address</th>
                <th>Attempts</th>
                <th>Risk Level</th>
            </tr>
            </thead>

            <tbody id="ipTableBody">

            </tbody>

        </table>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
